# Ollama tuning for a 2GB card (Quadro P600).
#
# Install with:
#   sudo systemctl edit ollama.service      # paste the [Service] block below
#   sudo systemctl daemon-reload && sudo systemctl restart ollama
#   systemctl show ollama.service -p Environment    # confirm it took
#
# That last line matters: a systemd override that silently did nothing is an easy
# hour to lose wondering why the tuning had no effect.

[Service]
# Keep the model resident forever. Without this Ollama unloads it after five minutes
# idle and the next page pays the full load cost again -- which on this card is most
# of a minute before any recognition happens.
Environment="OLLAMA_KEEP_ALIVE=-1"

# One request at a time. DEPLOY.txt suggests 4, but that document assumed an 8GB
# card: four concurrent contexts do not fit in 2048MiB and the failure mode is
# thrashing or an out-of-memory kill partway through a page, not a clean error.
Environment="OLLAMA_NUM_PARALLEL=1"

# 2048 instead of the 4096 default. The engine sends one crop at a time and caps
# output at 512 tokens, so a larger window buys nothing and its KV cache is what
# pushes the model off the GPU. Verified: placement went from 38% to 41% GPU and
# VRAM use from nothing to 1310MiB of 2048MiB after setting this.
Environment="OLLAMA_CONTEXT_LENGTH=2048"

# Halve the KV cache again. Together with the smaller context this is the headroom
# that lets the language half of the model sit in VRAM.
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"

# NOTE ON PLACEMENT
# Even with all of the above, `ollama ps` reports roughly 59%/41% CPU/GPU on this
# card. That is not a misconfiguration: the model ships as two blobs, a language
# model and a vision tower, and both together exceed 2048MiB. The vision half runs
# on CPU, which is why a page costs ~80s rather than a few seconds. A larger card is
# the only fix; nothing here is left untuned.
